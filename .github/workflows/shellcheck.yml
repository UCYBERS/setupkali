name: ShellCheck

on:
  push:
    branches: [master]
    paths: ['**.sh', '**.md', 'tests/**', '.github/workflows/shellcheck.yml']
  pull_request:
    paths: ['**.sh', '**.md', 'tests/**', '.github/workflows/shellcheck.yml']

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Syntax check
        run: bash -n setupkali.sh

      - name: ShellCheck
        run: shellcheck --severity=style setupkali.sh

      - name: Smoke tests
        run: sudo bash tests/smoke.sh
