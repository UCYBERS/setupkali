name: ShellCheck

on:
  push:
    branches: [master]
    paths: ['**.sh', '**.md', 'tests/**', '.github/workflows/shellcheck.yml']
  pull_request:
    paths: ['**.sh', '**.md', 'tests/**', '.github/workflows/shellcheck.yml']

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Syntax check
        run: bash -n setupkali.sh

      - name: ShellCheck
        run: shellcheck --severity=style setupkali.sh

      - name: Smoke tests
        run: sudo bash tests/smoke.sh
