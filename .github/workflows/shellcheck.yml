name: ShellCheck

on:
  push:
    branches: [master]
    paths: ['**.sh', '.github/workflows/shellcheck.yml']
  pull_request:
    paths: ['**.sh', '.github/workflows/shellcheck.yml']

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n setupkali.sh

      - name: ShellCheck
        run: shellcheck --severity=style setupkali.sh
