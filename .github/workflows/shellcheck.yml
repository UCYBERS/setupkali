name: ShellCheck

on:
  push:
    branches: [master]
    paths: ['**.sh', '**.md', 'tests/**', '.github/workflows/shellcheck.yml']
  pull_request:
    paths: ['**.sh', '**.md', 'tests/**', '.github/workflows/shellcheck.yml']

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check
        run: bash -n setupkali.sh

      - name: ShellCheck
        run: shellcheck --severity=style setupkali.sh

      - name: Smoke tests
        run: sudo bash tests/smoke.sh
